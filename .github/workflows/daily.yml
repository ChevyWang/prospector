name: daily

on:
  schedule:
    - cron: "30 22 * * *"   # UTC 22:30 = 北京时间 06:30
  workflow_dispatch: {}      # 支持手动触发测试

permissions:
  contents: write            # 允许把报告和状态 commit 回仓库

concurrency:
  group: daily
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync

      - run: uv run python pipeline.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}   # 可选，覆盖 config.yaml
          LLM_MODEL: ${{ secrets.LLM_MODEL }}         # 可选，覆盖 config.yaml
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 每天 commit 回仓库：既是交付物(报告)，也是去重状态，顺带防止
      # GitHub 对 60 天无活动仓库自动禁用定时任务
      - name: commit report & state
        run: |
          git config user.name "prospector-bot"
          git config user.email "actions@github.com"
          git add reports data || true
          git commit -m "daily: $(date -u +%Y-%m-%d)" || echo "nothing new today"
          git push
